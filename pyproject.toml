[project]
name = "musicstudio"
version = "0.2.0"
description = "A music studio built for agents: motifs as first-class objects, degree-space pitch, harmonic scaffolds, and a critique pass."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ms = "musicstudio.cli:main"
ms-mcp = "musicstudio.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0",
]
analysis = [
    "numpy>=2.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicstudio"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
