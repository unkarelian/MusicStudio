[project]
name = "musicstudio"
version = "0.3.0"
description = "A music studio built for agents: motifs as first-class objects, degree-space pitch, harmonic scaffolds, and a critique pass."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ms = "musicstudio.cli:main"
ms-mcp = "musicstudio.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0",
]
analysis = [
    "numpy>=2.5.2",
]
# Neural singers (DiffSinger voicebanks). No voicebank ships with the studio:
# see SINGERS.md for where to get one and what its licence asks of you.
neural = [
    "numpy>=2.5.2",
    "onnxruntime>=1.20",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicstudio"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
