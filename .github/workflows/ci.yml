name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --all-extras
      - name: Tests
        run: uv run pytest tests/ -q
      - name: Pronouncing dictionary (pinned by hash; the sung examples use English words)
        run: uv run ms lyrics install
      - name: Dogfood build must lint clean
        run: |
          uv run python examples/build_dusk.py
          uv run ms -p gallery lint dusk
          uv run python examples/build_lanterns.py
          uv run ms -p gallery lint lanterns
          uv run python examples/build_undertow.py
          uv run ms -p gallery lint undertow
          uv run python examples/build_last_train.py
          uv run ms -p gallery lint last_train
          uv run python examples/build_first_words.py
          uv run ms -p gallery lint first_words
          uv run python examples/build_splinter.py
          uv run ms -p gallery lint splinter
          uv run python examples/build_press_start.py
          uv run ms -p gallery lint press_start

  core-without-extras:
    # The core promises no dependencies; prove it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (no extras)
        run: uv sync
      - name: Tests
        run: uv run pytest tests/ -q
